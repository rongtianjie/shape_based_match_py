<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="topDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="5" y="5" width="118" height="118" rx="28" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5"/>

  <!-- Layer Graphics -->
  <g filter="url(#shadow)">
    <!-- Bottom Layer -->
    <polyline points="23,90 64,113 105,90" fill="none" stroke="#bae6fd" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/>

    <!-- Middle Layer -->
    <polyline points="23,67 64,90 105,67" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- Top Diamond Layer -->
    <polygon points="64,21 105,44 64,67 23,44" fill="url(#topDiamond)" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round"/>

    <!-- Precision Crosshair Reticle -->
    <circle cx="64" cy="44" r="5" fill="#2563eb"/>
    <circle cx="64" cy="44" r="10.5" fill="none" stroke="#2563eb" stroke-width="2.2" opacity="0.75"/>
    <line x1="64" y1="30.5" x2="64" y2="36.5" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="64" y1="51.5" x2="64" y2="57.5" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="50.5" y1="44" x2="56.5" y2="44" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="71.5" y1="44" x2="77.5" y2="44" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>